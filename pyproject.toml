[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recon-helper"
version = "1.0.1"
description = "本地 CSV、XLSX 和 JSON 对账核对工具"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "recon-helper contributors"}]
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only"]
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1", "pandas>=2.0", "PyYAML>=6.0", "xlrd>=2.0", "pyarrow>=15.0"]

[project.scripts]
recon = "recon.cli:main"

[tool.setuptools.packages.find]
include = ["recon*"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"tests/*" = ["E402"]
