[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recon-helper"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1", "pandas>=2.0", "PyYAML>=6.0"]

[project.scripts]
recon = "recon.cli:main"

[tool.setuptools.packages.find]
include = ["recon*"]
